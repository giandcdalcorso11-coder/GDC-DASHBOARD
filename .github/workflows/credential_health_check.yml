name: Credential Health Check

# Testa periodicamente le credenziali a lunga vita di cui dipende la
# catena A5-A7 + Pipeline Watcher/Notify (PAT GitHub, service account
# Google, refresh token Gmail) — stesso principio di ig_token_refresh.py
# per il token Instagram, ma qui solo verifica, nessun rinnovo. Se una
# fallisce, il workflow fallisce e notify_failures.yml (vedi la sua
# watch-list) manda la push "Errore automazione". Vedi
# scripts/credential_health_check.py per i dettagli.

on:
  schedule:
    - cron: '42 7 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements_a7.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements_a7.txt

      - name: Run Credential Health Check
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CREDENTIALS:   ${{ secrets.GOOGLE_CREDENTIALS }}
          GMAIL_CLIENT_ID:      ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET:  ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN:  ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/credential_health_check.py
