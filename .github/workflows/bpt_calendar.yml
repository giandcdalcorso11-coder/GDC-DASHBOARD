name: BPT Calendar

on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch:
    inputs:
      bpt_target_month:
        description: 'Override mese calendario BPT (formato YYYY-MM, es. 2026-08) — lascia vuoto per il default automatico (mese corrente + 1)'
        required: false
        type: string

jobs:

  run-bpt-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Installa dipendenze Python
        run: pip install -r scripts/requirements.txt

      - name: Esegui BPT Calendar
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BPT_TARGET_MONTH:   ${{ inputs.bpt_target_month }}
        run: python scripts/bpt_calendar.py

      - name: Notifica fallimento BPT
        if: failure()
        run: echo "❌ BPT Calendar FALLITO — controlla i log"
