<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{var __t=localStorage.getItem('gdc_theme_cache');if(__t&&__t!=='auto')document.documentElement.setAttribute('data-theme',__t);}catch(e){}</script>
<title>GDC WORKSPACE — Report A2</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --carta:#F5F0E8; --nero:#1C1C1C; --bianco:#FAFAF5;
  --maker:#4A7C59; --maker-bg:#C7DFCF;
  --life:#C2193A; --life-bg:#F5E0E6;
  --grigio:#6B6B6B; --border:#ddd6cb;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Jost',sans-serif;background:var(--carta);color:var(--nero);min-height:100vh;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){ --carta:#1A1A1A; --bianco:#242424; --nero:#F0EBE1; --border:#3A3A3A; --grigio:#9A9A9A; }:root:not([data-theme="light"]) .back-btn,:root:not([data-theme="light"]) .month-item{ background:var(--bianco); border-color:var(--border); }}:root[data-theme="dark"]{ --carta:#1A1A1A; --bianco:#242424; --nero:#F0EBE1; --border:#3A3A3A; --grigio:#9A9A9A; }:root[data-theme="dark"] .back-btn,:root[data-theme="dark"] .month-item{ background:var(--bianco); border-color:var(--border); }
.page-content{ width:100%; max-width:560px; margin:0 auto; padding:20px 16px; }
.back-btn{ display:inline-flex; align-items:center; gap:6px; background:var(--bianco); border:1.5px solid var(--border); border-radius:999px; padding:5px 12px 5px 9px; font-size:.72rem; font-weight:700; cursor:pointer; color:var(--grigio); text-decoration:none; transition:border-color .15s,color .15s; user-select:none; margin-bottom:14px; }
.back-btn:hover{ border-color:var(--nero); color:var(--nero); }
.pill-hub-wrap{ display:inline-flex; padding:1.5px; background:var(--border); border-radius:999px; clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%); transition:background .2s; margin-bottom:14px; }
.pill-hub{ display:inline-flex; align-items:center; font-family:'Jost',sans-serif; font-size:.72rem; font-weight:700; height:32px; padding:0 14px 0 18px; background:var(--bianco); color:var(--grigio); cursor:pointer; text-decoration:none; border:none; border-radius:999px; transition:color .15s; clip-path:polygon(12.5px 0,100% 0,100% 100%,12.5px 100%,0 50%); }
.pill-hub:hover{ color:var(--nero); }
.page-title{ font-size:1.25rem; font-weight:800; margin-bottom:4px; }
.page-sub{ font-size:.76rem; color:var(--grigio); line-height:1.5; margin-bottom:18px; }
.month-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bianco); border:1.5px solid var(--border); border-radius:14px; padding:13px 16px; margin-bottom:8px; text-decoration:none; color:var(--nero); transition:opacity .15s; }
.month-item:hover{ opacity:.75; }
.month-name{ font-weight:700; font-size:.85rem; }
.month-arr{ font-size:.9rem; color:var(--grigio); }
.empty-state{ text-align:center; padding:40px 16px; color:var(--grigio); font-size:.82rem; line-height:1.6; }

/* vista report: iframe a pagina piena, niente page-content */
body.report-view{ display:flex; flex-direction:column; }
.report-bar{ display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--bianco); border-bottom:1.5px solid var(--border); }
.report-bar .back-btn,.report-bar .pill-hub-wrap{ margin-bottom:0; }
.report-frame{ flex:1; width:100%; border:none; min-height:calc(100vh - 54px); }
</style>
</head>
<body>
<div id="listView" class="page-content" style="display:none;">
  <div class="pill-hub-wrap"><a class="pill-hub" href="page_agent_a2_v3.html">Agente 2</a></div>
  <div class="page-title">Report mensili</div>
  <div class="page-sub">Lo stesso report che prima veniva consegnato in pptx, ora come pagina HTML — stesso contenuto, stessa struttura.</div>
  <div id="monthList"></div>
</div>

<div id="reportBar" class="report-bar" style="display:none;">
  <div class="pill-hub-wrap"><a class="pill-hub" href="report.html">Report mensili</a></div>
</div>
<iframe id="reportFrame" class="report-frame" style="display:none;"></iframe>

<script>
const SUPA_URL='https://pnzabwfsgkvejnrtrjcp.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuemFid2ZzZ2t2ZWpucnRyamNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTg4OTIsImV4cCI6MjA5NDQzNDg5Mn0.xhnaMOxdymJSfLy77jhPo2w0K7j3z_tSgeRozqifSlk';

function gdcToken(){ return sessionStorage.getItem('gdc_token'); }
function gdcSessionExpired(){
  sessionStorage.removeItem('gdc_token'); sessionStorage.removeItem('gdc_uid');
  let banner=document.getElementById('gdcSessionBanner');
  if(!banner){ banner=document.createElement('div'); banner.id='gdcSessionBanner';
    banner.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#C2193A;color:#fff;text-align:center;padding:12px 16px;font-family:Jost,sans-serif;font-size:.85rem;letter-spacing:.02em;box-shadow:0 2px 12px rgba(0,0,0,.25);';
    document.body.prepend(banner);
  }
  banner.textContent='Sessione scaduta — reindirizzamento al login...';
  setTimeout(()=>{ window.location.href='../../../page_login_v6.html'; },1600);
}
async function sbFetch(url,options){
  options=options||{};
  const headers=Object.assign({'apikey':SUPA_KEY,'Authorization':'Bearer '+gdcToken()},options.headers||{});
  const res=await fetch(url,Object.assign({},options,{headers:headers}));
  if(res.status===401||res.status===403){ gdcSessionExpired(); throw new Error('session-expired'); }
  return res;
}

async function loadList(){
  document.getElementById('listView').style.display='block';
  document.body.classList.remove('report-view');
  const list = document.getElementById('monthList');
  try{
    const res = await sbFetch(SUPA_URL+'/rest/v1/report_mensili?agente=eq.a2&select=mese&order=anno.desc,mese_num.desc');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    if(!rows.length){
      list.innerHTML = '<div class="empty-state">Nessun report ancora generato.<br>Compare qui dopo che A2 scrive il primo report su Supabase.</div>';
      return;
    }
    list.innerHTML = rows.map(r=>`
      <a class="month-item" href="report.html?mese=${encodeURIComponent(r.mese)}">
        <span class="month-name">${r.mese}</span>
        <span class="month-arr">&#8594;</span>
      </a>
    `).join('');
  }catch(e){
    console.error('Errore caricamento elenco report:', e);
    list.innerHTML = '<div class="empty-state">Impossibile caricare l\'elenco al momento.</div>';
  }
}

async function loadReport(mese){
  document.body.classList.add('report-view');
  document.getElementById('reportBar').style.display='flex';
  const frame = document.getElementById('reportFrame');
  try{
    const res = await sbFetch(SUPA_URL+'/rest/v1/report_mensili?agente=eq.a2&mese=eq.'+encodeURIComponent(mese)+'&select=html');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    if(!rows.length){
      document.body.innerHTML = '<div class="page-content"><div class="pill-hub-wrap"><a class="pill-hub" href="report.html">Report mensili</a></div><div class="empty-state">Report non disponibile per '+mese+'.</div></div>';
      return;
    }
    frame.srcdoc = rows[0].html;
    frame.style.display='block';
  }catch(e){
    console.error('Errore caricamento report:', e);
  }
}

if(!gdcToken()){
  window.location.href='../../../page_login_v6.html';
} else {
  const params = new URLSearchParams(window.location.search);
  const mese = params.get('mese');
  if(mese) loadReport(mese); else loadList();
}
</script>
</body>
</html>
